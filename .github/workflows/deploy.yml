name: Deploy to Cloudflare

# Deploys with Wrangler from CI, so no local Node or Git install is needed.
# Requires a CLOUDFLARE_API_TOKEN repository secret.

on:
  push:
    branches:
      - main
      - claude/elevenlabs-cloudflare-rebuild-lcbxi4
  workflow_dispatch:

# The same commit is pushed to both branches above, so two runs start seconds apart.
# Without this they both read d1_migrations before either has written to it, both decide
# the same migrations are unapplied, and the loser dies on a UNIQUE constraint. Queued
# rather than cancelled: cancel-in-progress would kill a run in the middle of a migration.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      # Before the deploy, so code is never live against a schema it expects but does not have.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply workbench --remote

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
